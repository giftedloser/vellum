name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        id: frontend-build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Upload frontend failure log
        if: failure() && steps.frontend-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend-build.log
          retention-days: 7

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        id: rust-audit
        shell: bash
        run: |
          set -o pipefail
          cargo audit --file src-tauri/Cargo.lock 2>&1 | tee rust-audit.log

      - name: Upload Rust audit failure log
        if: failure() && steps.rust-audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-audit-log
          path: rust-audit.log
          retention-days: 7

  tauri:
    name: Rust and Tauri check
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native icons
        run: npm run icons

      - name: Check Rust formatting
        id: rust-format
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --check 2>&1 | tee rust-format.log

      - name: Upload Rust formatting failure log
        if: failure() && steps.rust-format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-format-log
          path: rust-format.log
          retention-days: 7

      - name: Test Tauri core
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-release:
    name: Windows release executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Windows release executable
        run: npm run tauri -- build --no-bundle
